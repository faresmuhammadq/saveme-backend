# Shared parameters.
#
# The collection grammar every list endpoint uses: cursor, limit, filter and
# sort, plus the resource identifier in a path. An endpoint declares which
# fields it allows through `x-filterable` and `x-sortable` on the operation;
# anything outside those lists is refused, never ignored.
#
# Request headers are parameters too, but they live in headers.yaml so that
# "the headers" is one file to read.

components:
  parameters:

    Cursor:
      name: cursor
      in: query
      required: false
      description: |
        Opaque position token. A client stores what `meta.next_cursor` gave it
        and sends it back unchanged. It MUST NOT parse, compare, increment,
        construct, or reuse one across endpoints.

        A cursor is valid only for the endpoint that issued it and only with
        the same filter and sort; changing either starts a new walk. Absent
        means from the beginning.

        Unparseable or foreign gives 400 INVALID_CURSOR. On a change feed, a
        cursor older than the tombstone horizon gives 410 SYNC_CURSOR_EXPIRED
        and the client resyncs the whole scope.
      schema:
        type: string
      examples:
        firstPage:
          summary: Omitted — start from the beginning
          value: null
        nextPage:
          summary: Echoed back from meta.next_cursor
          value: djE6dHhuOjE3NjQ1NjcyMDA6MDE5MmY3YTA

    Limit:
      name: limit
      in: query
      required: false
      description: |
        Page size. A value above the maximum is CLAMPED, not refused, and
        `meta.limit` reports what was applied — so a client bug throttles
        instead of breaking a sync loop. A non-integer or a value below 1 is
        400 INVALID_QUERY_PARAMETER.
      schema:
        type: integer
        default: 50
        minimum: 1
        maximum: 200

    Filter:
      name: filter
      in: query
      required: false
      style: deepObject
      explode: true
      description: |
        `filter[<field>]=<op>:<value>`, where a bare value means `eq`.
        Operators: eq, ne, lt, lte, gt, gte, in (comma-separated values).
        Repeating a field ANDs its conditions. There is no `or`, no grouping
        and no free-text query language.

        The field must appear in the operation's `x-filterable` list, and the
        operator must be allowed for it, or the request is refused with
        FILTER_FIELD_NOT_SUPPORTED or FILTER_OPERATOR_NOT_SUPPORTED. Values
        follow the field's own type rules: a date filter takes YYYY-MM-DD, a
        money filter takes minor units.
      schema:
        type: object
        additionalProperties:
          type: string
          pattern: '^(eq|ne|lt|lte|gt|gte|in):.+$|^[^:]+$'
      examples:
        equality:
          summary: Bare value means eq
          value:
            wallet_id: 0192f79e-0000-7000-8000-000000000001
        range:
          summary: One month of transactions
          value:
            date: 'gte:2026-01-01'
        set:
          summary: Several values at once
          value:
            status: 'in:pending,active'

    Sort:
      name: sort
      in: query
      required: false
      description: |
        Comma-separated field list, `-` prefix for descending. Every field must
        appear in the operation's `x-sortable` list or the request is refused
        with SORT_FIELD_NOT_SUPPORTED.

        The server appends `id` when the client has not, so the keyset the
        cursor walks is always total and a page boundary cannot repeat or skip
        rows that share a sort value.
      schema:
        type: string
        pattern: '^-?[a-z_]+(,-?[a-z_]+)*$'
      examples:
        newestFirst:
          value: '-date,id'

    ResourceId:
      name: id
      in: path
      required: true
      description: |
        The resource identifier, generated by the client so a record can be
        created offline and the write retried safely. Lowercase hyphenated
        UUIDv7. Anything else is 422 INVALID_ID; a well-formed id belonging to
        another scope is 404 NOT_FOUND, which discloses nothing.

        The timestamp inside a UUIDv7 is never used for ordering, cursors,
        business dates or authorization.
      schema:
        type: string
        format: uuid
        pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'
      examples:
        transaction:
          value: 0192f7a0-1c3d-7abc-9f01-2b3c4d5e6f70
