        description: 'A repeat of the create.'
        headers: *successHeaders
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas.yaml#/components/schemas/Envelope'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/SharedBudgetInvitation'
      '201':
        description: 'Created. Carries `meta.share_url`.'
        headers: *successHeaders
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas.yaml#/components/schemas/Envelope'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/SharedBudgetInvitation'
      '400':
        $ref: '../components/responses.yaml#/components/responses/BadRequest'
