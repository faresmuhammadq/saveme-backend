/wallets/{id}/recurring-rules/{rid}:
  get:
    operationId: getRecurringRule
    tags: [Wallets & Ledger]
    summary: Read one recurring rule, live or tombstoned.
    description: |
      Any active member of the rule's wallet may read it (row R-01). A
      tombstone is returned with `deleted_at` set. A rule of another wallet
      (a transfer rule through its destination included), another kind of
      record, an unknown id, a non-member, or a deleted path wallet is 404
      NOT_FOUND.
    parameters:
      - *walletId
      - &ruleId
        $ref: '#/components/parameters/RuleId'
      - *acceptLanguage
      - *correlationId
      - *clientPlatform
      - *clientVersion
    responses:
      '200':
        description: The rule.
        headers: *successHeaders
        content:
          application/json:
            schema: &ruleEnvelope
              allOf:
                - $ref: '../components/schemas.yaml#/components/schemas/Envelope'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/RecurringRule'
            examples:
              rent:
                summary: A monthly rent rule
                value:
                  data: *rentRule
                  meta: {}
      '400':
        $ref: '../components/responses.yaml#/components/responses/BadRequest'
      '401':
        $ref: '../components/responses.yaml#/components/responses/Unauthenticated'
      '404':
        $ref: '../components/responses.yaml#/components/responses/NotFound'
      '406':
        $ref: '../components/responses.yaml#/components/responses/NotAcceptable'
      '422':
        $ref: '../components/responses.yaml#/components/responses/UnprocessableEntity'
      '426':
        $ref: '../components/responses.yaml#/components/responses/UpgradeRequired'
      '500':
        $ref: '../components/responses.yaml#/components/responses/InternalError'

  put:
    operationId: upsertRecurringRule
    tags: [Wallets & Ledger]
    summary: Create or save the whole recurring rule, addressed by the client-generated identifier.
    description: |
      A create, not a POST: the client generates `rid` offline and the same
      write may arrive twice. `version` is omitted or 0 to create, and
      carries the client's last-seen value to save. A new rule belongs to the
      path wallet (`wallet_id`); for a transfer that is the source. The
      server records `timezone` (the author's profile timezone, never
      changes) and `created_by`.

      In the same unit of work the server materialises the rule's
      occurrences (status `scheduled`) from max(`start_date`, creation day −
      90 days) through the rule's today + 35 days, and at least the next one
      — never auto-confirming anything; that is the hourly job's and
      `materialise`'s. "Today" is the date in the rule's `timezone`.

      **Schedule**: daily — `start_date` + k·`interval` days; weekly — every
      `interval` weeks on `start_date`'s weekday; monthly — every `interval`
      months from `start_date`'s month on `anchor_day`, clamped to the
      month's last day; yearly — every `interval` years in `start_date`'s
      month on `anchor_day`, clamped. Each date is computed from the origin,
      never from the previous one. Dates before `start_date` are dropped;
      rounds are numbered from 1. At most one of `end_date` and
      `occurrence_count`; both null is open-ended. Every round counts toward
      `occurrence_count`, skipped or not.

      **Amounts**: `amount_basis: per_occurrence` — each round is
      `amount_minor`; `total` (needs `occurrence_count`) — `amount_minor` is
      split over the rounds evenly, the remainder going one minor unit at a
      time to the earliest rounds; the parts sum exactly to the total. A
      total must be at least `occurrence_count` minor units.

      **Presets**: `gameya` — monthly, interval 1, kind expense,
      `occurrence_count` 2–120, `end_date` null, `payout_round` (1 to the
      count) and `payout_category_id` (an income category) required; one
      extra payout occurrence (`is_payout: true`, kind income) on the payout
      round's date worth the sum of every round's scheduled amount.
      `installment` — monthly, interval 1, expense or transfer,
      `occurrence_count` 2–120, `end_date` null. `custom` and `installment`
      take null payout members.

      **Editing**: a saved template change (amount, category, texts,
      `auto_confirm`) is applied to every occurrence still `scheduled` and
      not `edited`. Once any occurrence is confirmed or skipped, `frequency`,
      `interval`, `anchor_day`, `start_date`, `amount_basis` and
      `payout_round` are frozen, `end_date` / `occurrence_count` cannot
      cut off a resolved occurrence, and for a gam'eya or a `total` rule
      `occurrence_count` and `amount_minor` are frozen too (they fix every
      share and the payout). Before that, a schedule change
      recomputes the pending, unedited occurrences. To change the series
      from date D: set `end_date` to D − 1 here, then create a new rule
      starting D. `status`: create as `active` or `paused`; `active` ⇄
      `paused`; either → `ended` (pending occurrences dated after the rule's
      today are tombstoned). An ended rule refuses any change; delete it
      instead. Resuming, or switching `auto_confirm` on, never auto-confirms
      occurrences dated before that day.

      Outcomes, in this order of precedence:

      - not verified → 403 EMAIL_NOT_VERIFIED;
      - malformed id → 422 INVALID_ID; malformed body → 422 VALIDATION_FAILED;
      - caller not an active member of the path wallet, path wallet deleted,
        `rid` held by a rule of another wallet or by any other kind of
        record, or a version above 0 for an unknown `rid` → 404 NOT_FOUND;
      - caller is a viewer (row R-02) → 403 FORBIDDEN;
      - the rule is tombstoned → 409 VERSION_CONFLICT with the tombstone in
        `current`, even for an identical body;
      - body identical to the stored rule → 200, nothing changed;
      - stale version → 409 VERSION_CONFLICT with the stored rule in
        `current`; nothing merged;
      - transfer rule and the caller lacks T-02 in the destination → 403
        FORBIDDEN;
      - state rules → 422 VALIDATION_FAILED, one entry each:
        - `preset`, `kind`, `currency`, `counter_wallet_id` changed; a
          frozen schedule member changed; any change to an ended rule →
          IMMUTABLE_FIELD at that member;
        - on create, `currency` not the wallet's → CURRENCY_MISMATCH at
          `/currency` (never re-checked later; a wallet whose currency changes
          afterwards refuses the rule's confirmations instead);
          a transfer between wallets of different currencies →
          CURRENCY_MISMATCH at `/counter_wallet_id`;
        - category or payout category not the caller's own or a platform
          one (unless unchanged), deleted, unknown or of the wrong kind; a
          category on a transfer → INVALID_ENUM_VALUE at that member;
        - destination not a live wallet the caller is a member of, the
          source itself, or set on an income or expense →
          INVALID_ENUM_VALUE at `/counter_wallet_id`;
        - a member outside its preset's shape, `ended` on create,
          `anchor_day` on a daily or weekly rule, both `end_date` and
          `occurrence_count`, `amount_basis: total` without a count →
          INVALID_ENUM_VALUE at that member;
        - a missing required member (category on income/expense, destination
          on a transfer, `anchor_day` on monthly/yearly, payout members on a
          gam'eya) → REQUIRED at it;
        - amount, interval (1–365), anchor day (1–31), count (1–1000; 2–120
          for presets), payout round, a date outside 1900–2999, `end_date`
          before `start_date`, a gam'eya payout above 2^53 − 1, a `total`
          below `occurrence_count` minor units, a count below `payout_round`,
          an end that cuts off a resolved occurrence → OUT_OF_RANGE at that
          member;
      - otherwise 201 (created) or 200 (saved), version + 1.
    parameters:
      - *walletId
      - *ruleId
      - *acceptLanguage
      - *correlationId
      - *clientPlatform
      - *clientVersion
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RecurringRuleWrite'
          examples:
            createRent:
              summary: Create an automatic monthly rent rule
              value:
                preset: custom
                status: active
                kind: expense
                amount_minor: 450000
                amount_basis: per_occurrence
                currency: EGP
                category_id: 0192f7a1-0000-7000-8000-0000000000c5
                counter_wallet_id: null
                description: Rent
                memo: null
                counterparty: null
                auto_confirm: true
                frequency: monthly
                interval: 1
                anchor_day: 1
                start_date: '2026-11-01'
                end_date: null
                occurrence_count: null
                payout_round: null
                payout_category_id: null
                version: 0
            createInstallment:
              summary: A fridge, 10,000 EGP over 12 monthly installments, split by the server
              value:
                preset: installment
                status: active
                kind: expense
                amount_minor: 1000000
                amount_basis: total
                currency: EGP
                category_id: 0192f7a1-0000-7000-8000-0000000000c8
                counter_wallet_id: null
                description: Fridge
                memo: null
                counterparty: B.TECH
                auto_confirm: true
                frequency: monthly
                interval: 1
                anchor_day: 25
                start_date: '2026-10-25'
                end_date: null
                occurrence_count: 12
                payout_round: null
                payout_category_id: null
                version: 0
            endBeforeRaise:
              summary: Series edit from 1 January — step 1, end the old rule on 31 December
              value:
                preset: custom
                status: active
                kind: expense
                amount_minor: 450000
                amount_basis: per_occurrence
                currency: EGP
                category_id: 0192f7a1-0000-7000-8000-0000000000c5
                counter_wallet_id: null
                description: Rent
                memo: null
                counterparty: null
                auto_confirm: true
                frequency: monthly
                interval: 1
                anchor_day: 1
                start_date: '2026-11-01'
                end_date: '2026-12-31'
                occurrence_count: null
                payout_round: null
                payout_category_id: null
                version: 1
    responses:
      '200':
        description: Saved, or an identical replay returning the rule unchanged.
        headers: *successHeaders
        content:
          application/json:
            schema: *ruleEnvelope
      '201':
        description: Created; its occurrences are materialised.
        headers: *successHeaders
        content:
          application/json:
            schema: *ruleEnvelope
            examples:
              created:
                summary: The rent rule, created
                value:
                  data: *rentRule
                  meta: {}
      '400':
        $ref: '../components/responses.yaml#/components/responses/BadRequest'
      '401':
        $ref: '../components/responses.yaml#/components/responses/Unauthenticated'
      '403':
        $ref: '../components/responses.yaml#/components/responses/Forbidden'
      '404':
        $ref: '../components/responses.yaml#/components/responses/NotFound'
      '406':
        $ref: '../components/responses.yaml#/components/responses/NotAcceptable'
      '409':
        $ref: '../components/responses.yaml#/components/responses/Conflict'
      '415':
        $ref: '../components/responses.yaml#/components/responses/UnsupportedMediaType'
      '422':
        $ref: '../components/responses.yaml#/components/responses/UnprocessableEntity'
      '426':
        $ref: '../components/responses.yaml#/components/responses/UpgradeRequired'
      '500':
        $ref: '../components/responses.yaml#/components/responses/InternalError'

  delete:
    operationId: deleteRecurringRule
    tags: [Wallets & Ledger]
    summary: Delete the rule and its occurrences. Tombstones, never removals; final.
    description: |
      Tombstones the rule and every one of its occurrences in one unit of
      work (row R-02). The transactions it already produced are untouched.
      Returns the rule's tombstone. Deleting an already deleted rule returns
      its tombstone with nothing changed, whatever version is sent. A stale
      version on a live rule is 409 VERSION_CONFLICT. There is no restore:
      a deleted rule is final (end a rule to keep its history).
    parameters:
      - *walletId
      - *ruleId
      - *acceptLanguage
      - *correlationId
      - *clientPlatform
      - *clientVersion
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RuleVersionOnly'
          examples:
            delete:
              value:
                version: 2
    responses:
      '200':
        description: The tombstone.
        headers: *successHeaders
        content:
          application/json:
            schema: *ruleEnvelope
      '400':
        $ref: '../components/responses.yaml#/components/responses/BadRequest'
      '401':
        $ref: '../components/responses.yaml#/components/responses/Unauthenticated'
      '403':
        $ref: '../components/responses.yaml#/components/responses/Forbidden'
      '404':
        $ref: '../components/responses.yaml#/components/responses/NotFound'
      '406':
        $ref: '../components/responses.yaml#/components/responses/NotAcceptable'
      '409':
        $ref: '../components/responses.yaml#/components/responses/Conflict'
      '415':
        $ref: '../components/responses.yaml#/components/responses/UnsupportedMediaType'
      '422':
        $ref: '../components/responses.yaml#/components/responses/UnprocessableEntity'
      '426':
        $ref: '../components/responses.yaml#/components/responses/UpgradeRequired'
      '500':
        $ref: '../components/responses.yaml#/components/responses/InternalError'

/wallets/{id}/recurring-rules/{rid}/materialise:
  post:
    operationId: materialiseRecurringRule
    tags: [Wallets & Ledger]
    summary: Catch the rule up now — extend its occurrences and auto-confirm what is due.
    description: |
      Does for this one rule exactly what the hourly job does (row R-02):
      materialises its occurrences through the horizon and, for an active
      rule with `auto_confirm`, confirms every `scheduled` occurrence dated
      on or before the rule's today and on or after the day automatic
      confirmation took effect, recording each transaction as the rule's
      author. Idempotent: a second request changes nothing. A paused or
      ended rule is returned unchanged. Takes no request body; returns the
      rule. Pull the wallet feed afterwards for the occurrences and
      transactions.

      An automatic confirmation that is refused (the author lacks T-02, a
      transfer's destination is deleted or no longer theirs, currencies
      differ) leaves the occurrence `scheduled` with
      `auto_confirm_refusal` set; it is not attempted again.

      Outcomes: not verified → 403 EMAIL_NOT_VERIFIED; malformed id → 422
      INVALID_ID; non-member, unknown rule, a rule of another wallet → 404
      NOT_FOUND; viewer → 403 FORBIDDEN; tombstoned rule → 409
      VERSION_CONFLICT with the tombstone in `current`; otherwise 200.
    parameters:
      - *walletId
      - *ruleId
      - *acceptLanguage
      - *correlationId
      - *clientPlatform
      - *clientVersion
    responses:
      '200':
        description: The rule, after catching up.
        headers: *successHeaders
        content:
          application/json:
            schema: *ruleEnvelope
      '400':
        $ref: '../components/responses.yaml#/components/responses/BadRequest'
      '401':
        $ref: '../components/responses.yaml#/components/responses/Unauthenticated'
      '403':
        $ref: '../components/responses.yaml#/components/responses/Forbidden'
      '404':
        $ref: '../components/responses.yaml#/components/responses/NotFound'
      '406':
        $ref: '../components/responses.yaml#/components/responses/NotAcceptable'
      '409':
        $ref: '../components/responses.yaml#/components/responses/Conflict'
      '422':
        $ref: '../components/responses.yaml#/components/responses/UnprocessableEntity'
      '426':
        $ref: '../components/responses.yaml#/components/responses/UpgradeRequired'
      '500':
        $ref: '../components/responses.yaml#/components/responses/InternalError'

/wallets/{id}/occurrences:
  get:
    operationId: listOccurrences
    tags: [Wallets & Ledger]
    summary: List the wallet's live occurrences, earliest date first.
    description: |
      Any active member may read it (row R-01). Returns the live occurrences
      of the wallet's rules. Tombstones are not listed.

      Sorted by `date` ascending unless `sort` says otherwise; `created_at`
      is the other sortable field. Every sort is stabilised by `id`.

      Filters (anything else is refused, never ignored):

      - `recurring_rule_id`: eq, in (at most 50 values);
      - `status`: eq, in (`scheduled`, `confirmed`, `skipped`);
      - `date`: eq, gt, gte, lt, lte, with `YYYY-MM-DD` values.

      "Due" and "missed" are not statuses: compute them from `date` and the
      rule's `timezone` (due: `scheduled` and dated on or before the rule's
      today; missed: due while a later non-payout occurrence of the same
      rule is also due). A cursor is valid only with the same filters and
      sort.
    x-filterable: [recurring_rule_id, status, date]
    x-sortable: [date, created_at]
    parameters:
      - *walletId
      - *cursor
      - *limit
      - *filter
      - *sort
      - *acceptLanguage
      - *correlationId
      - *clientPlatform
      - *clientVersion
    responses:
