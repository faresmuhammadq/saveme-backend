name: saveme-production

services:
  app:
    image: ${IMAGE:?}:${IMAGE_TAG:?}
    container_name: saveme-production-app
    restart: unless-stopped
    env_file: .env
    ports:
      - "0.0.0.0:${APP_PORT:?}:8080"
    volumes:
      - storage:/var/www/html/storage
    networks:
      - infra

volumes:
  storage:
    name: saveme-production-storage

networks:
  infra:
    name: saveme-infra
    external: true
