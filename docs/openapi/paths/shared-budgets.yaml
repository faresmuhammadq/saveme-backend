        headers: *successHeaders
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas.yaml#/components/schemas/Envelope'
                - type: object
                  properties:
                    data:
                      type: array
                      items:
                        $ref: '#/components/schemas/SharedBudgetChangeRow'
                    meta:
                      $ref: './sync.yaml#/components/schemas/ChangeFeedMeta'
      '400':
        $ref: '../components/responses.yaml#/components/responses/BadRequest'
      '401':
        $ref: '../components/responses.yaml#/components/responses/Unauthenticated'
      '404':
        $ref: '../components/responses.yaml#/components/responses/NotFound'
      '406':
        $ref: '../components/responses.yaml#/components/responses/NotAcceptable'
      '410':
        $ref: '../components/responses.yaml#/components/responses/Gone'
      '422':
        $ref: '../components/responses.yaml#/components/responses/UnprocessableEntity'
      '426':
        $ref: '../components/responses.yaml#/components/responses/UpgradeRequired'
      '500':
        $ref: '../components/responses.yaml#/components/responses/InternalError'


components:
  schemas:
    Instant:
      type: string
      format: date-time

    LimitHistory:
      type: array
      description: |
        The limit by Budget Period, oldest first: each applies from the start
        of the Budget Period it was set in. A period reads the latest entry at
        or before its start. `limit_minor` null means no limit from then on.
      items:
        type: object
        required: [applies_from, limit_minor]
        additionalProperties: false
        properties:
          applies_from:
            type: string
            format: date
          limit_minor:
            type: [integer, 'null']
            minimum: 1
            maximum: 9007199254740991

    StartDayHistory:
      type: array
      description: The Budget Period start day by date, oldest first; the first entry has `applies_from` null. A change applies from the next period.
      items:
        type: object
        required: [start_day, applies_from]
        additionalProperties: false
        properties:
          start_day:
            type: integer
            minimum: 1
            maximum: 28
          applies_from:
            type: [string, 'null']
            format: date

    SharedBudget:
      description: |
        A spending limit and category list several people track together.
        Own sync scope: rides the budget's feed as `shared_budget`, and each
        member's own membership rides their user feed as `shared_budget_member`.
      allOf:
        - $ref: '../components/schemas.yaml#/components/schemas/SyncableResource'
        - type: object
          required: [owner_id, name, currency, start_day, timezone, limit_minor, archived_at, limit_history, start_day_history]
          properties:
            owner_id:
              type: string
              format: uuid
              description: Read-only. The person who changes the budget.
            name:
              type: string
              maxLength: 100
            currency:
              type: string
              pattern: '^[A-Z]{3}$'
              description: ISO 4217. Only expenses in this currency join. Immutable.
            start_day:
              type: integer
              minimum: 1
              maximum: 28
              description: The day of the month a Budget Period begins on.
            timezone:
              type: string
              readOnly: true
              description: The IANA timezone captured from the owner's profile at creation; "today" for this budget, the same for every member.
            limit_minor:
              type: [integer, 'null']
              minimum: 1
              maximum: 9007199254740991
              description: The overall limit per Budget Period, in minor units of `currency`; null for none.
            archived_at:
              type: [string, 'null']
              format: date-time
              description: Read-only. When the budget was archived; null while active.
            limit_history:
              $ref: '#/components/schemas/LimitHistory'
            start_day_history:
              $ref: '#/components/schemas/StartDayHistory'

    SharedBudgetWrite:
      type: object
      description: The whole writable budget plus the last-seen version. `owner_id`, `timezone`, `archived_at`, the histories and the envelope members are refused with UNKNOWN_FIELD.
      required: [name, currency, start_day, limit_minor]
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        currency:
          type: string
          pattern: '^[A-Z]{3}$'
        start_day:
          type: integer
          minimum: 1
          maximum: 28
        limit_minor:
          type: [integer, 'null']
          minimum: 1
          maximum: 9007199254740991
        version:
          type: integer
          minimum: 0
          description: The client's last-seen version. Omitted or 0 means create.

    SharedBudgetPatch:
      type: object
      description: Some changeable members plus the last-seen version. `currency` is immutable and refused as an unknown member.
      required: [version]
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        start_day:
          type: integer
          minimum: 1
          maximum: 28
        limit_minor:
          type: [integer, 'null']
          minimum: 1
          maximum: 9007199254740991
        version:
          type: integer
          minimum: 1

    SharedBudgetVersionOnly:
      type: object
      required: [version]
      additionalProperties: false
      properties:
        version:
          type: integer
          minimum: 1

    SharedBudgetTransfer:
      type: object
      required: [user_id, version]
      additionalProperties: false
      properties:
        user_id:
          type: string
          format: uuid
          description: The active member to hand the budget to.
        version:
          type: integer
          minimum: 1

    SharedBudgetLine:
      description: One category on a Shared Budget's list, with an optional limit. Carries the category's display fields so every member can render a category they do not own.
      allOf:
        - $ref: '../components/schemas.yaml#/components/schemas/SyncableResource'
        - type: object
          required: [shared_budget_id, category_id, limit_minor, name, icon, color, limit_history]
          properties:
            shared_budget_id:
              type: string
              format: uuid
            category_id:
              type: string
              format: uuid
              description: Immutable.
            limit_minor:
              type: [integer, 'null']
              minimum: 1
              maximum: 9007199254740991
            name:
              type: [string, 'null']
              description: Read-only. The category's name; null for a platform category, which every client already holds.
            icon:
              type: [string, 'null']
              readOnly: true
            color:
              type: [string, 'null']
              readOnly: true
            limit_history:
              $ref: '#/components/schemas/LimitHistory'

    SharedBudgetLineWrite:
      type: object
      required: [category_id, limit_minor]
      additionalProperties: false
      properties:
        category_id:
          type: string
          format: uuid
        limit_minor:
          type: [integer, 'null']
          minimum: 1
          maximum: 9007199254740991
        version:
          type: integer
          minimum: 0

    SharedBudgetMember:
      description: One person's membership of a Shared Budget.
      allOf:
        - $ref: '../components/schemas.yaml#/components/schemas/SyncableResource'
        - type: object
          required: [shared_budget_id, user_id, display_name, role, read_only]
          properties:
            shared_budget_id:
              type: string
              format: uuid
            user_id:
              type: string
              format: uuid
            display_name:
              type: [string, 'null']
              description: As of the read; null for a person who left the product ("Former member").
            role:
              type: string
              enum: [owner, member]
            read_only:
              type: boolean
              readOnly: true
              description: Set by the server when the owner's plan allows fewer members; a read-only member reads and leaves but adds nothing.

    SharedBudgetEntry:
      description: |
        One transaction's appearance in a Shared Budget: the author, category,
        date, amount and note. No transaction id, wallet, balance, memo or
        counterparty. Rides the budget's feed as `shared_budget_entry`.
      allOf:
        - $ref: '../components/schemas.yaml#/components/schemas/SyncableResource'
        - type: object
          required: [shared_budget_id, created_by, category_id, date, amount_minor, description, detached_at]
          properties:
            shared_budget_id:
              type: string
              format: uuid
            created_by:
              type: string
              format: uuid
            category_id:
              type: string
              format: uuid
            date:
              type: string
              format: date
            amount_minor:
              type: integer
              minimum: 1
              maximum: 9007199254740991
            description:
              type: [string, 'null']
              maxLength: 100
              description: Erased when the author leaves the budget.
            detached_at:
              type: [string, 'null']
              format: date-time
              description: When the entry stopped following its transaction (its author left or its wallet was deleted); null while it follows.

    SharedBudgetInvitation:
      description: An offer to join a Shared Budget by link. Rides the budget's feed as `shared_budget_invitation`, to the owner only.
      allOf:
        - $ref: '../components/schemas.yaml#/components/schemas/SyncableResource'
        - type: object
          required: [shared_budget_id, invited_by, status, expires_at]
          properties:
            shared_budget_id:
              type: string
              format: uuid
            invited_by:
              type: string
              format: uuid
            status:
              type: string
              enum: [pending, accepted, declined, revoked, expired]
            expires_at:
              type: string
              format: date-time

    SharedBudgetInvitationWrite:
      type: object
      description: Nothing but the optional version; omitted or 0 means create.
      additionalProperties: false
      properties:
        version:
          type: integer
          minimum: 0

    SharedBudgetInvitationToken:
      type: object
      required: [token]
      additionalProperties: false
      properties:
        token:
          type: string
          pattern: '^[A-Za-z0-9_-]{43}$'

    SharedBudgetInvitationPreview:
      type: object
      description: What a token offers, for the confirmation screen. Joining shows the person the amount, date, category, note and author of every entry, and never anyone's wallet.
      required: [invitation_id, shared_budget_id, name, currency, owner_display_name, member_count, expires_at, already_member]
      additionalProperties: false
      properties:
        invitation_id:
          type: string
          format: uuid
        shared_budget_id:
          type: string
          format: uuid
        name:
          type: string
        currency:
          type: string
          pattern: '^[A-Z]{3}$'
        owner_display_name:
          type: [string, 'null']
        member_count:
          type: integer
          minimum: 1
        expires_at:
          type: string
          format: date-time
        already_member:
          type: boolean

    SharedBudgetFigure:
      type: object
      description: One spent / limit pair. The `limit`, `remaining` and `over_limit` are null where no limit applied that period.
      required: [limit, spent, remaining, over_limit]
      properties:
        limit:
          oneOf:
            - $ref: '../components/schemas.yaml#/components/schemas/Money'
            - type: 'null'
        spent:
          $ref: '../components/schemas.yaml#/components/schemas/Money'
        remaining:
          oneOf:
            - $ref: '../components/schemas.yaml#/components/schemas/Money'
            - type: 'null'
        over_limit:
          type: [boolean, 'null']

    SharedBudgetProgress:
      description: |
        A derived read model, never stored and never synced. Every figure is an
        exact sum of entries; no percentage is returned. `projected_end` is the
        overall `spent` extrapolated over the period at the pace so far,
        rounded up to the minor unit, for the current period only.
        `unlisted_spent` is spending in categories no line names (Other, or a
        line since removed).
      allOf:
        - $ref: '#/components/schemas/SharedBudgetFigure'
        - type: object
          required: [shared_budget_id, period, is_current, projected_end, lines, unlisted_spent, members]
          properties:
            shared_budget_id:
              type: string
              format: uuid
            period:
              type: object
              required: [start, end, days_in_period, days_elapsed]
              additionalProperties: false
              properties:
                start:
                  type: string
                  format: date
                end:
                  type: string
                  format: date
                days_in_period:
                  type: integer
                days_elapsed:
                  type: [integer, 'null']
            is_current:
              type: boolean
            projected_end:
              oneOf:
                - $ref: '../components/schemas.yaml#/components/schemas/Money'
                - type: 'null'
            lines:
              type: array
              items:
                allOf:
                  - $ref: '#/components/schemas/SharedBudgetFigure'
                  - type: object
                    required: [line_id, category_id]
                    properties:
                      line_id:
                        type: string
                        format: uuid
                      category_id:
                        type: string
                        format: uuid
            unlisted_spent:
              $ref: '../components/schemas.yaml#/components/schemas/Money'
            members:
              type: array
              description: Spending per author, ascending by user id; a name is null for a person who left.
              items:
                type: object
                required: [user_id, display_name, spent]
                additionalProperties: false
                properties:
                  user_id:
                    type: string
                    format: uuid
                  display_name:
                    type: [string, 'null']
                  spent:
                    $ref: '../components/schemas.yaml#/components/schemas/Money'

    SharedBudgetSummary:
      type: object
      required: [shared_budget_id, from, to, currency, spent, by_category, by_member]
      additionalProperties: false
      properties:
        shared_budget_id:
          type: string
          format: uuid
        from:
          type: string
          format: date
        to:
          type: string
          format: date
        currency:
          type: string
        spent:
          $ref: '../components/schemas.yaml#/components/schemas/Money'
        by_category:
          type: array
          items:
            type: object
            required: [category_id, spent]
            additionalProperties: false
            properties:
              category_id:
                type: string
                format: uuid
              spent:
                $ref: '../components/schemas.yaml#/components/schemas/Money'
        by_member:
          type: array
          items:
            type: object
            required: [user_id, display_name, spent]
            additionalProperties: false
            properties:
              user_id:
                type: string
                format: uuid
              display_name:
                type: [string, 'null']
              spent:
                $ref: '../components/schemas.yaml#/components/schemas/Money'

    SharedBudgetTrend:
      type: object
      required: [shared_budget_id, periods]
      additionalProperties: false
      properties:
        shared_budget_id:
          type: string
          format: uuid
        periods:
          type: array
          items:
            type: object
            required: [start, end, spent, limit]
            additionalProperties: false
            properties:
              start:
                type: string
                format: date
              end:
                type: string
                format: date
              spent:
                $ref: '../components/schemas.yaml#/components/schemas/Money'
              limit:
                oneOf:
                  - $ref: '../components/schemas.yaml#/components/schemas/Money'
                  - type: 'null'

    SharedBudgetHead:
      type: object
      required: [shared_budget_id, change_seq, purged_change_seq]
      additionalProperties: false
      properties:
        shared_budget_id:
          type: string
          format: uuid
        change_seq:
          type: integer
          format: int64
          description: The budget's scope head.
        purged_change_seq:
          type: integer
          format: int64
          description: The budget's purge horizon.

    SharedBudgetChangeRow:
      type: object
      description: One record on a Shared Budget's feed. Clients skip a `type` they do not know.
      required: [type, record]
      additionalProperties: false
      properties:
        type:
          type: string
          enum: [shared_budget, shared_budget_member, shared_budget_line, shared_budget_entry, shared_budget_invitation]
        record:
          anyOf:
            - $ref: '#/components/schemas/SharedBudget'
            - $ref: '#/components/schemas/SharedBudgetMember'
            - $ref: '#/components/schemas/SharedBudgetLine'
            - $ref: '#/components/schemas/SharedBudgetEntry'
            - $ref: '#/components/schemas/SharedBudgetInvitation'
