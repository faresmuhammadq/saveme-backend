# Shared Budgets (ADR-0027). Every operation sits under /api/v1, inherits the
# root's bearer scheme and runs through the shared runtime, so each also
# documents the shared refusals it can produce.
#
# A Shared Budget is a spending limit and category list that several people
# track together, whichever wallets pay. Its own sync scope: a person reads a
# budget only as one of its members (a non-member gets 404 NOT_FOUND, a member
# whose role does not permit the action 403 FORBIDDEN), and membership never
# grants access to any wallet. Only the owner changes the budget, its limits,
# its category lines, its start day and its members. Every write sits behind
# the verification gate (403 EMAIL_NOT_VERIFIED); reads and leaving are not.
#
# A transaction counts toward a budget only when its author names it
# (`shared_budget_id` on the transaction and the recurring rule, see
# transactions.yaml and recurring.yaml). A Shared Budget Entry carries the
# author, category, date, amount and note, and never a wallet, a balance, a
# memo or a counterparty. Progress and reports sum entries, computed on every
# read; the period and "today" come from the budget, so every member reads the
# same figures.
#
# v1 invites by link only; the link carries the token, which exists once, in
# the create's answer (`meta.share_url`).
#
# New in v1.16. No new error code.

/shared-budgets:
  get:
    operationId: listSharedBudgets
    tags: [Budgeting]
    summary: 'List the Shared Budgets the caller belongs to.'
    description: |
      Returns every live Shared Budget the caller is an active member of,
      archived ones included. Tombstoned budgets are not listed: a person who
      lost a budget learns it from the user feed's tombstoned membership.
      Sorted by `created_at`, stabilised by `id`. No filters.
    x-filterable: []
    x-sortable: [created_at]
    parameters:
      - $ref: '../components/parameters.yaml#/components/parameters/Cursor'
      - $ref: '../components/parameters.yaml#/components/parameters/Limit'
      - $ref: '../components/parameters.yaml#/components/parameters/Filter'
      - $ref: '../components/parameters.yaml#/components/parameters/Sort'
      - $ref: '../components/headers.yaml#/components/parameters/AcceptLanguage'
      - $ref: '../components/headers.yaml#/components/parameters/XCorrelationId'
      - $ref: '../components/headers.yaml#/components/parameters/XClientPlatform'
      - $ref: '../components/headers.yaml#/components/parameters/XClientVersion'
    responses:
      '200':
        description: 'A page of Shared Budgets. None is 200 with `data: []`.'
        headers: &successHeaders
          X-Request-Id:
            $ref: '../components/headers.yaml#/components/headers/XRequestId'
          Content-Language:
            $ref: '../components/headers.yaml#/components/headers/ContentLanguage'
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas.yaml#/components/schemas/Envelope'
                - type: object
                  properties:
                    data:
                      type: array
                      items:
                        $ref: '#/components/schemas/SharedBudget'
                    meta:
                      $ref: '../components/schemas.yaml#/components/schemas/CollectionMeta'
      '400':
        $ref: '../components/responses.yaml#/components/responses/BadRequest'
      '401':
        $ref: '../components/responses.yaml#/components/responses/Unauthenticated'
      '404':
        $ref: '../components/responses.yaml#/components/responses/NotFound'
      '406':
        $ref: '../components/responses.yaml#/components/responses/NotAcceptable'
      '422':
        $ref: '../components/responses.yaml#/components/responses/UnprocessableEntity'
      '426':
        $ref: '../components/responses.yaml#/components/responses/UpgradeRequired'
      '500':
        $ref: '../components/responses.yaml#/components/responses/InternalError'


/shared-budgets/{id}:
  get:
    operationId: getSharedBudget
    tags: [Budgeting]
    summary: 'Read one Shared Budget the caller belongs to.'
    description: |
      Returned to its members only. A non-member, an unknown id and any other
      kind of record are 404 NOT_FOUND.
    parameters:
      - &budgetId
        $ref: '../components/parameters.yaml#/components/parameters/ResourceId'
      - $ref: '../components/headers.yaml#/components/parameters/AcceptLanguage'
      - $ref: '../components/headers.yaml#/components/parameters/XCorrelationId'
      - $ref: '../components/headers.yaml#/components/parameters/XClientPlatform'
      - $ref: '../components/headers.yaml#/components/parameters/XClientVersion'
    responses:
      '200':
        description: 'The budget.'
        headers: *successHeaders
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas.yaml#/components/schemas/Envelope'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/SharedBudget'
      '400':
        $ref: '../components/responses.yaml#/components/responses/BadRequest'
      '401':
        $ref: '../components/responses.yaml#/components/responses/Unauthenticated'
      '404':
        $ref: '../components/responses.yaml#/components/responses/NotFound'
      '406':
        $ref: '../components/responses.yaml#/components/responses/NotAcceptable'
      '422':
        $ref: '../components/responses.yaml#/components/responses/UnprocessableEntity'
      '426':
        $ref: '../components/responses.yaml#/components/responses/UpgradeRequired'
      '500':
        $ref: '../components/responses.yaml#/components/responses/InternalError'

  put:
    operationId: saveSharedBudget
    tags: [Budgeting]
    summary: 'Create a Shared Budget, or replace the one the caller owns.'
    description: |
      Omitted or 0 `version` creates: the caller becomes its owner and its only
      member, in the timezone of their profile. A repeat of the same body is
      `200` with nothing changed. Only the owner changes it afterwards; `currency`
      is immutable (422 IMMUTABLE_FIELD). A changed `limit_minor` applies from
      the current Budget Period and a changed `start_day` from the next, each
      kept in the histories so a past period reports the limit it had. A stale
      version, or a tombstone, is 409 VERSION_CONFLICT. A member who is not the
      owner is 403 FORBIDDEN.
    parameters:
      - *budgetId
      - $ref: '../components/headers.yaml#/components/parameters/AcceptLanguage'
      - $ref: '../components/headers.yaml#/components/parameters/XCorrelationId'
      - $ref: '../components/headers.yaml#/components/parameters/XClientPlatform'
      - $ref: '../components/headers.yaml#/components/parameters/XClientVersion'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SharedBudgetWrite'
    responses:
      '200':
        description: 'The budget, unchanged by a replay or replaced.'
        headers: *successHeaders
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas.yaml#/components/schemas/Envelope'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/SharedBudget'
      '201':
        description: 'Created.'
        headers: *successHeaders
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas.yaml#/components/schemas/Envelope'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/SharedBudget'
      '400':
        $ref: '../components/responses.yaml#/components/responses/BadRequest'
      '401':
        $ref: '../components/responses.yaml#/components/responses/Unauthenticated'
      '403':
        $ref: '../components/responses.yaml#/components/responses/Forbidden'
      '404':
        $ref: '../components/responses.yaml#/components/responses/NotFound'
      '406':
        $ref: '../components/responses.yaml#/components/responses/NotAcceptable'
      '409':
        $ref: '../components/responses.yaml#/components/responses/Conflict'
      '415':
        $ref: '../components/responses.yaml#/components/responses/UnsupportedMediaType'
      '422':
        $ref: '../components/responses.yaml#/components/responses/UnprocessableEntity'
      '426':
        $ref: '../components/responses.yaml#/components/responses/UpgradeRequired'
      '500':
        $ref: '../components/responses.yaml#/components/responses/InternalError'

  patch:
    operationId: patchSharedBudget
    tags: [Budgeting]
    summary: 'Change some members of a Shared Budget the caller owns.'
    description: |
      Any of `name`, `start_day` and `limit_minor` (null removes the overall
      limit) plus the required `version`. Never creates.
    parameters:
      - *budgetId
      - $ref: '../components/headers.yaml#/components/parameters/AcceptLanguage'
      - $ref: '../components/headers.yaml#/components/parameters/XCorrelationId'
      - $ref: '../components/headers.yaml#/components/parameters/XClientPlatform'
      - $ref: '../components/headers.yaml#/components/parameters/XClientVersion'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SharedBudgetPatch'
    responses:
      '200':
        description: 'The updated budget.'
        headers: *successHeaders
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas.yaml#/components/schemas/Envelope'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/SharedBudget'
      '400':
        $ref: '../components/responses.yaml#/components/responses/BadRequest'
      '401':
        $ref: '../components/responses.yaml#/components/responses/Unauthenticated'
      '403':
        $ref: '../components/responses.yaml#/components/responses/Forbidden'
      '404':
        $ref: '../components/responses.yaml#/components/responses/NotFound'
      '406':
        $ref: '../components/responses.yaml#/components/responses/NotAcceptable'
      '409':
        $ref: '../components/responses.yaml#/components/responses/Conflict'
      '415':
        $ref: '../components/responses.yaml#/components/responses/UnsupportedMediaType'
      '422':
        $ref: '../components/responses.yaml#/components/responses/UnprocessableEntity'
      '426':
        $ref: '../components/responses.yaml#/components/responses/UpgradeRequired'
      '500':
        $ref: '../components/responses.yaml#/components/responses/InternalError'

  delete:
    operationId: deleteSharedBudget
    tags: [Budgeting]
    summary: 'Delete a Shared Budget the caller owns, for everyone.'
    description: |
      A tombstone: every entry, line and membership is tombstoned with it and
      each member's user feed is told. The transactions stay in their wallets.
      Deleting a tombstone returns it, to the person who owned it.
    parameters:
      - *budgetId
      - $ref: '../components/headers.yaml#/components/parameters/AcceptLanguage'
      - $ref: '../components/headers.yaml#/components/parameters/XCorrelationId'
      - $ref: '../components/headers.yaml#/components/parameters/XClientPlatform'
      - $ref: '../components/headers.yaml#/components/parameters/XClientVersion'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SharedBudgetVersionOnly'
    responses:
      '200':
        description: 'The tombstoned budget.'
        headers: *successHeaders
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas.yaml#/components/schemas/Envelope'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/SharedBudget'
      '400':
        $ref: '../components/responses.yaml#/components/responses/BadRequest'
      '401':
        $ref: '../components/responses.yaml#/components/responses/Unauthenticated'
      '403':
        $ref: '../components/responses.yaml#/components/responses/Forbidden'
      '404':
        $ref: '../components/responses.yaml#/components/responses/NotFound'
      '406':
        $ref: '../components/responses.yaml#/components/responses/NotAcceptable'
      '409':
        $ref: '../components/responses.yaml#/components/responses/Conflict'
      '415':
        $ref: '../components/responses.yaml#/components/responses/UnsupportedMediaType'
      '422':
        $ref: '../components/responses.yaml#/components/responses/UnprocessableEntity'
      '426':
        $ref: '../components/responses.yaml#/components/responses/UpgradeRequired'
      '500':
        $ref: '../components/responses.yaml#/components/responses/InternalError'


