components:
  schemas:

    ChangeRow:
      type: object
      description: |
        One record on a change feed: its type and the record exactly as its
        read endpoint returns it for the reader. A deletion is a record with
        `deleted_at` set; there is no separate operation member. Clients skip
        a `type` they do not know (later features add types inside v1).
      required: [type, record]
      additionalProperties: false
      properties:
        type:
          type: string
          description: |
            User feed: `profile`, `device_session`, `category`,
            `wallet_member` (the caller's own memberships), and from v1.8
            `budget` (the caller's own budgets). Wallet feed:
            `wallet`, `wallet_member`, `category_reference`, `transaction`,
            and from v1.7 `recurring_rule`, `occurrence`.
          enum: [profile, device_session, category, wallet_member, wallet, category_reference, transaction, recurring_rule, occurrence, budget]
        record:
          anyOf:
            - $ref: './identity.yaml#/components/schemas/Profile'
            - $ref: './identity.yaml#/components/schemas/DeviceSession'
            - $ref: './categories.yaml#/components/schemas/Category'
            - $ref: './wallets.yaml#/components/schemas/WalletMember'
            - $ref: './wallets.yaml#/components/schemas/Wallet'
            - $ref: './categories.yaml#/components/schemas/CategoryReference'
            - $ref: './transactions.yaml#/components/schemas/Transaction'
            - $ref: './recurring.yaml#/components/schemas/RecurringRule'
            - $ref: './recurring.yaml#/components/schemas/Occurrence'
            - $ref: './budgets.yaml#/components/schemas/Budget'

    ChangeFeedMeta:
      type: object
      description: |
        The `meta` of a feed page: the shared collection members plus
        `sync_cursor`. `has_more` is false exactly when `next_cursor` is null
        (as for any collection); `sync_cursor` is never null — it is the
        position after this page (or the incoming position when the page is
        empty), the value to store and send back as `cursor` next time.
      required: [next_cursor, has_more, limit, sync_cursor]
      additionalProperties: false
      properties:
        next_cursor:
          type: [string, 'null']
          description: Opaque; equal to `sync_cursor` while `has_more`, null on the last page.
        has_more:
          type: boolean
        limit:
          type: integer
          minimum: 1
          maximum: 200
          description: The page size actually applied, after clamping.
        sync_cursor:
          type: string
          description: Opaque position to resume from. Never parsed, compared or constructed by a client, and valid only for the feed and account that issued it.

    SyncBatch:
      type: object
      description: 1 to 50 writes, applied one at a time in array order. No other member.
      required: [items]
      additionalProperties: false
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 50
          items:
            $ref: '#/components/schemas/BatchItem'

    BatchItem:
      type: object
      description: |
        One per-record write. `type` and `op` select it (see the operation's
        table), `id` (and, for a transaction, `wallet_id`) address it, and
        `data` is its body verbatim.
      required: [type, op, id, data]
      additionalProperties: false
      properties:
        type:
          type: string
          enum: [wallet, category, transaction, profile, recurring_rule, occurrence, budget]
        op:
          type: string
          enum: [upsert, delete, restore]
          description: '`restore` is for `transaction` only; `delete` for `wallet`, `category`, `transaction`, `recurring_rule` and `budget`; `profile` and `occurrence` take only `upsert`.'
        id:
          type: string
          format: uuid
          description: The record's UUIDv7 (client-generated); for `profile`, the caller's profile id.
        wallet_id:
          type: string
          format: uuid
          description: Required for `transaction`, `recurring_rule` and `occurrence`, and refused on every other type — the wallet path of its single write (either wallet of a transfer; a rule's or occurrence's own wallet).
        data:
          description: The single write's body.
          anyOf:
            - $ref: './wallets.yaml#/components/schemas/WalletWrite'
            - $ref: './categories.yaml#/components/schemas/CategoryWrite'
            - $ref: './transactions.yaml#/components/schemas/TransactionWrite'
            - $ref: './identity.yaml#/components/schemas/ProfileWrite'
            - $ref: './transactions.yaml#/components/schemas/VersionOnly'
            - $ref: './transactions.yaml#/components/schemas/TransactionRestore'
            - $ref: './recurring.yaml#/components/schemas/RecurringRuleWrite'
            - $ref: './recurring.yaml#/components/schemas/RuleVersionOnly'
            - $ref: './recurring.yaml#/components/schemas/OccurrenceWrite'
            - $ref: './budgets.yaml#/components/schemas/BudgetWrite'
            - $ref: './budgets.yaml#/components/schemas/BudgetVersionOnly'

    BatchItemResult:
      type: object
      description: |
        The answer to one item: the status and body its single write would
        have produced. Exactly one of `record` and `problem` is non-null.
      required: [type, id, outcome, status, record, problem]
      additionalProperties: false
      properties:
        type:
          type: string
          enum: [wallet, category, transaction, profile, recurring_rule, occurrence, budget]
        id:
          type: string
          format: uuid
        outcome:
          type: string
          enum: [applied, conflict, rejected]
          description: '`applied` for 200/201; `conflict` for 409 VERSION_CONFLICT; `rejected` for every other status.'
        status:
          type: integer
          minimum: 200
          maximum: 599
          description: The HTTP status the single write would have answered.
        record:
          description: The stored record when `applied`; otherwise null.
          anyOf:
            - type: 'null'
            - $ref: './wallets.yaml#/components/schemas/Wallet'
            - $ref: './categories.yaml#/components/schemas/Category'
            - $ref: './transactions.yaml#/components/schemas/Transaction'
            - $ref: './identity.yaml#/components/schemas/Profile'
            - $ref: './recurring.yaml#/components/schemas/RecurringRule'
            - $ref: './recurring.yaml#/components/schemas/Occurrence'
            - $ref: './budgets.yaml#/components/schemas/Budget'
        problem:
          description: The single write's problem body when `conflict` or `rejected`; otherwise null. Pointers are rooted at the item's `data`.
          anyOf:
            - type: 'null'
            - $ref: '../components/schemas.yaml#/components/schemas/Problem'
