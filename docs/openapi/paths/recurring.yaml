# Recurring transactions (spec 014, brief B7). Every operation sits under
# /api/v1, inherits the root's bearer scheme and runs through the shared
# runtime, so each also documents the shared refusals it can produce.
#
# Frozen for the C7 client. Authorization follows the permission matrix in
# specs/010-wallets-membership/spec.md §6 (rows R-01, R-02; T-02 in a
# transfer rule's destination) — the only copy of it (P-08 rule 5). A caller
# who is not an active member of the path wallet gets 404 NOT_FOUND, never
# 403. Every write sits behind the verification gate (403 EMAIL_NOT_VERIFIED).
#
# Occurrences are created only by the server (ADR-0018): a write to an
# occurrence id the server never materialised is 404. An occurrence has no
# postings and never counts in a balance; confirming it records one ordinary
# transaction (transactions.yaml) carrying `occurrence_id`.
#
# New in v1.7. No new error code.

/wallets/{id}/recurring-rules:
  get:
    operationId: listRecurringRules
    tags: [Wallets & Ledger]
    summary: List the wallet's live recurring rules, every status.
    description: |
      Any active member may read it (row R-01). Returns the live rules whose
      `wallet_id` is this wallet — active, paused and ended. A transfer
      rule is listed under its source wallet only. Tombstones are not listed
      (read one by id, or through the wallet feed).

      Sorted by `created_at` unless `sort` says otherwise; `start_date` is
      the other sortable field. Every sort is stabilised by `id`.

      Filters (anything else is refused, never ignored):

      - `status`: eq, in (`active`, `paused`, `ended`).

      A cursor is valid only with the same filters and sort.
    x-filterable: [status]
    x-sortable: [created_at, start_date]
    parameters:
      - &walletId
        $ref: '../components/parameters.yaml#/components/parameters/ResourceId'
      - &cursor
        $ref: '../components/parameters.yaml#/components/parameters/Cursor'
      - &limit
        $ref: '../components/parameters.yaml#/components/parameters/Limit'
      - &filter
        $ref: '../components/parameters.yaml#/components/parameters/Filter'
      - &sort
        $ref: '../components/parameters.yaml#/components/parameters/Sort'
      - &acceptLanguage
        $ref: '../components/headers.yaml#/components/parameters/AcceptLanguage'
      - &correlationId
        $ref: '../components/headers.yaml#/components/parameters/XCorrelationId'
      - &clientPlatform
        $ref: '../components/headers.yaml#/components/parameters/XClientPlatform'
      - &clientVersion
        $ref: '../components/headers.yaml#/components/parameters/XClientVersion'
    responses:
      '200':
        description: 'A page of rules. None is 200 with `data: []`, never 404.'
        headers: &successHeaders
          X-Request-Id:
            $ref: '../components/headers.yaml#/components/headers/XRequestId'
          Content-Language:
            $ref: '../components/headers.yaml#/components/headers/ContentLanguage'
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas.yaml#/components/schemas/Envelope'
                - type: object
                  properties:
                    data:
                      type: array
                      items:
                        $ref: '#/components/schemas/RecurringRule'
                    meta:
                      $ref: '../components/schemas.yaml#/components/schemas/CollectionMeta'
            examples:
              rentAndGameya:
                summary: A monthly rent rule and a gam'eya
                value:
                  data:
                    - &rentRule
                      id: 0192f7d0-0000-7000-8000-0000000000a1
                      wallet_id: 0192f79e-0000-7000-8000-000000000001
                      version: 1
                      change_seq: 901
                      created_at: '2026-10-02T09:00:00.000000Z'
                      updated_at: '2026-10-02T09:00:00.000000Z'
                      deleted_at: null
                      preset: custom
                      status: active
                      kind: expense
                      amount_minor: 450000
                      amount_basis: per_occurrence
                      currency: EGP
                      category_id: 0192f7a1-0000-7000-8000-0000000000c5
                      counter_wallet_id: null
                      description: Rent
                      memo: null
                      counterparty: null
                      auto_confirm: true
                      frequency: monthly
                      interval: 1
                      anchor_day: 1
                      start_date: '2026-11-01'
                      end_date: null
                      occurrence_count: null
                      payout_round: null
                      payout_category_id: null
                      timezone: Africa/Cairo
                      created_by: 0192f700-0000-7000-8000-000000000001
                    - &gameyaRule
                      id: 0192f7d0-0000-7000-8000-0000000000a2
                      wallet_id: 0192f79e-0000-7000-8000-000000000001
                      version: 1
                      change_seq: 905
                      created_at: '2026-10-02T09:05:00.000000Z'
                      updated_at: '2026-10-02T09:05:00.000000Z'
                      deleted_at: null
                      preset: gameya
                      status: active
                      kind: expense
                      amount_minor: 100000
                      amount_basis: per_occurrence
                      currency: EGP
