                          created_by: 0192f700-0000-7000-8000-000000000003
                    - type: transaction
                      id: 0192f7b0-0000-7000-8000-0000000000e4
                      outcome: rejected
                      status: 404
                      record: null
                      problem:
                        type: https://api.example/problems/not-found
                        title: Not found
                        status: 404
                        detail: Not found.
                        code: NOT_FOUND
                        request_id: 0192f7c0-9999-7000-8000-00000000abcd
                  meta: {}
              validationRefusal:
                summary: An item refused by its single write's validation, pointer rooted at its data
                value:
                  data:
                    - type: transaction
                      id: 0192f7b0-0000-7000-8000-0000000000e5
                      outcome: rejected
                      status: 422
                      record: null
                      problem:
                        type: https://api.example/problems/validation-failed
