                        created_by: 0192f700-0000-7000-8000-000000000001
                      problem: null
                    - type: transaction
                      id: 0192f7b0-0000-7000-8000-0000000000e2
                      outcome: conflict
                      status: 409
                      record: null
                      problem:
                        type: https://api.example/problems/version-conflict
                        title: Version conflict
                        status: 409
                        detail: This record changed on another device.
                        code: VERSION_CONFLICT
                        request_id: 0192f7c0-9999-7000-8000-00000000abcd
                        current:
                          id: 0192f7b0-0000-7000-8000-0000000000e2
                          wallet_id: 0192f79e-0000-7000-8000-000000000002
                          version: 3
                          change_seq: 133
                          created_at: '2026-10-01T18:20:00.000000Z'
                          updated_at: '2026-10-04T08:10:00.000000Z'
                          deleted_at: '2026-10-04T08:10:00.000000Z'
                          kind: expense
                          date: '2026-10-01'
                          amount_minor: 25000
                          currency: EGP
                          category_id: 0192f7a1-0000-7000-8000-0000000000c1
