                    has_more: false
                    limit: 50
      '400':
        $ref: '../components/responses.yaml#/components/responses/BadRequest'
      '401':
        $ref: '../components/responses.yaml#/components/responses/Unauthenticated'
      '404':
        $ref: '../components/responses.yaml#/components/responses/NotFound'
      '406':
        $ref: '../components/responses.yaml#/components/responses/NotAcceptable'
      '422':
        $ref: '../components/responses.yaml#/components/responses/UnprocessableEntity'
      '426':
        $ref: '../components/responses.yaml#/components/responses/UpgradeRequired'
      '500':
        $ref: '../components/responses.yaml#/components/responses/InternalError'

/wallets/{id}/occurrences/{oid}:
  get:
    operationId: getOccurrence
    tags: [Wallets & Ledger]
    summary: Read one occurrence, live or tombstoned.
    description: |
      Any active member of its wallet may read it (row R-01). A tombstone is
      returned with `deleted_at` set. An occurrence of another wallet,
      another kind of record, an unknown id, a non-member, or a deleted path
      wallet is 404 NOT_FOUND.
    parameters:
      - *walletId
      - &occurrenceId
        $ref: '#/components/parameters/OccurrenceId'
      - *acceptLanguage
      - *correlationId
      - *clientPlatform
      - *clientVersion
    responses:
      '200':
        description: The occurrence.
        headers: *successHeaders
        content:
          application/json:
            schema: &occurrenceEnvelope
              allOf:
                - $ref: '../components/schemas.yaml#/components/schemas/Envelope'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/Occurrence'
            examples:
              scheduled:
                summary: The next rent, upcoming
                value:
                  data: *rentOccurrence
                  meta: {}
      '400':
        $ref: '../components/responses.yaml#/components/responses/BadRequest'
      '401':
        $ref: '../components/responses.yaml#/components/responses/Unauthenticated'
      '404':
        $ref: '../components/responses.yaml#/components/responses/NotFound'
      '406':
        $ref: '../components/responses.yaml#/components/responses/NotAcceptable'
      '422':
        $ref: '../components/responses.yaml#/components/responses/UnprocessableEntity'
      '426':
        $ref: '../components/responses.yaml#/components/responses/UpgradeRequired'
      '500':
        $ref: '../components/responses.yaml#/components/responses/InternalError'

  put:
    operationId: saveOccurrence
    tags: [Wallets & Ledger]
    summary: Confirm, skip or edit one occurrence. Never creates.
    description: |
      The whole writable occurrence plus its last-seen `version` (≥ 1). The
      server alone creates occurrences (ADR-0018): an unknown `oid` is 404.

      - **Edit one**: change `date` (any calendar date 1900–2999),
        `amount_minor`, `category_id`, `description`, `memo` or
        `counterparty`. The occurrence becomes `edited` and later rule edits
        no longer change it; sending the rule-derived values back clears
        `edited`. `scheduled_date`, `ordinal` and the occurrence key never
        change.
      - **Confirm**: `status: confirmed` with a new client-generated UUIDv7
        in `transaction_id`. In the same unit of work one transaction with
        that id is recorded through the ledger with the occurrence's values
        as sent in this write (`cleared: false`, `created_by` the rule's
        author, `occurrence_id` and `recurring_rule_id` set); balances move.
        An identical replay is 200 with nothing changed. If the server or
        another member confirmed it first, this write is 409
        VERSION_CONFLICT with the confirmed occurrence in `current` — drop
        the local transaction, never resend under a new id.
      - **Skip** / **un-skip**: `status: skipped`, or back to `scheduled`.
        `transaction_id` null.

      Transitions: `scheduled` → `confirmed` | `skipped`; `skipped` →
      `scheduled` | `confirmed`; a confirmed occurrence never changes
      (correct its transaction through the transaction endpoints). A save
      that changes the occurrence clears `auto_confirm_refusal`, making it
      eligible for automatic confirmation again. An edited `category_id`
      must be of the occurrence's kind and the caller's own or a platform
      one (unless unchanged).

      Outcomes, in this order of precedence:

      - not verified → 403 EMAIL_NOT_VERIFIED;
      - malformed id → 422 INVALID_ID; malformed body → 422 VALIDATION_FAILED;
      - caller not an active member of the path wallet, path wallet deleted,
        `oid` unknown, of another wallet or held by another kind of record
        → 404 NOT_FOUND;
      - caller is a viewer (row R-02) → 403 FORBIDDEN;
      - the occurrence is tombstoned → 409 VERSION_CONFLICT with the
        tombstone in `current`;
      - body identical to the stored occurrence → 200, nothing changed;
      - stale version → 409 VERSION_CONFLICT with the stored occurrence in
        `current`; nothing merged;
      - confirming a transfer and the caller lacks T-02 in the destination
        → 403 FORBIDDEN;
      - state rules → 422 VALIDATION_FAILED, one entry each:
        - any change to a confirmed occurrence → IMMUTABLE_FIELD at that
          member;
        - `transaction_id` missing on a confirm → REQUIRED; set outside a
          confirm, or already held by another record → INVALID_ENUM_VALUE
          at `/transaction_id`;
        - category not the caller's own or a platform one (unless
          unchanged), deleted, unknown or of the wrong kind; a category on a
          transfer → INVALID_ENUM_VALUE at `/category_id`;
        - the confirmation itself refused: destination deleted or not a
          membership any more → INVALID_ENUM_VALUE at `/status`; currencies
          no longer match → CURRENCY_MISMATCH at `/status`;
        - amount, date or text out of bounds → OUT_OF_RANGE at that member;
      - otherwise 200, version + 1.
    parameters:
      - *walletId
      - *occurrenceId
      - *acceptLanguage
      - *correlationId
      - *clientPlatform
      - *clientVersion
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/OccurrenceWrite'
          examples:
            confirmWithActualAmount:
              summary: Confirm the electricity bill at the amount actually paid, on the day paid
              value:
                status: confirmed
                date: '2026-11-03'
                amount_minor: 61200
                category_id: 0192f7a1-0000-7000-8000-0000000000c9
                description: Electricity
                memo: null
                counterparty: null
                transaction_id: 0192f7e0-0000-7000-8000-0000000000f1
                version: 1
            skip:
              summary: Skip August
              value:
                status: skipped
                date: '2026-08-01'
                amount_minor: 450000
                category_id: 0192f7a1-0000-7000-8000-0000000000c5
                description: Rent
                memo: null
                counterparty: null
                transaction_id: null
                version: 1
    responses:
      '200':
        description: Saved, or an identical replay returning the occurrence unchanged. Never 201.
        headers: *successHeaders
        content:
          application/json:
            schema: *occurrenceEnvelope
            examples:
              confirmed:
                summary: Confirmed; its transaction exists with the same id
                value:
                  data:
                    id: 0192f7d1-0000-7000-8000-0000000000b3
                    wallet_id: 0192f79e-0000-7000-8000-000000000001
                    version: 2
                    change_seq: 951
                    created_at: '2026-10-02T09:10:00.000000Z'
                    updated_at: '2026-11-03T18:00:00.000000Z'
                    deleted_at: null
                    recurring_rule_id: 0192f7d0-0000-7000-8000-0000000000a3
                    ordinal: 2
                    is_payout: false
                    scheduled_date: '2026-11-01'
                    date: '2026-11-03'
                    status: confirmed
                    kind: expense
                    amount_minor: 61200
                    currency: EGP
                    category_id: 0192f7a1-0000-7000-8000-0000000000c9
                    counter_wallet_id: null
                    description: Electricity
                    memo: null
                    counterparty: null
                    edited: true
                    transaction_id: 0192f7e0-0000-7000-8000-0000000000f1
                    auto_confirm_refusal: null
                  meta: {}
      '400':
        $ref: '../components/responses.yaml#/components/responses/BadRequest'
      '401':
        $ref: '../components/responses.yaml#/components/responses/Unauthenticated'
      '403':
        $ref: '../components/responses.yaml#/components/responses/Forbidden'
      '404':
        $ref: '../components/responses.yaml#/components/responses/NotFound'
      '406':
        $ref: '../components/responses.yaml#/components/responses/NotAcceptable'
      '409':
        $ref: '../components/responses.yaml#/components/responses/Conflict'
      '415':
        $ref: '../components/responses.yaml#/components/responses/UnsupportedMediaType'
      '422':
        $ref: '../components/responses.yaml#/components/responses/UnprocessableEntity'
      '426':
        $ref: '../components/responses.yaml#/components/responses/UpgradeRequired'
      '500':
        $ref: '../components/responses.yaml#/components/responses/InternalError'

components:
  parameters:
    RuleId:
      name: rid
      in: path
      required: true
      description: |
        The recurring rule identifier, generated by the client so a rule can
        be created offline and the write retried safely. Lowercase hyphenated
        UUIDv7; anything else is 422 INVALID_ID.
      schema:
        type: string
        format: uuid
        pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'

    OccurrenceId:
      name: oid
      in: path
      required: true
      description: |
        The occurrence identifier, minted by the server when it materialised
        the occurrence (never by a client). Lowercase hyphenated UUIDv7;
        anything else is 422 INVALID_ID.
      schema:
        type: string
        format: uuid
        pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'

  schemas:
    Preset:
      type: string
      description: '`gameya` (جمعية) and `installment` (قسط) constrain the shape (see upsertRecurringRule); `custom` is any rule. Never changes.'
      enum: [custom, gameya, installment]

    RuleStatus:
      type: string
      description: '`active` ⇄ `paused`; either → `ended` (final; the rule then accepts only deletion).'
      enum: [active, paused, ended]

    AmountBasis:
      type: string
      description: '`per_occurrence`: each round is `amount_minor`. `total`: `amount_minor` is split over `occurrence_count` rounds, the remainder to the earliest rounds.'
      enum: [per_occurrence, total]

    Frequency:
      type: string
      enum: [daily, weekly, monthly, yearly]

    OccurrenceStatus:
      type: string
      description: |
        Stored states only. "Due" and "missed" are derived from `date` and the
        rule's `timezone`, never sent.
      enum: [scheduled, confirmed, skipped]

    AutoConfirmRefusal:
      type: [string, 'null']
      description: Why the server could not confirm this occurrence automatically; it will not try again. Null when nothing was refused, and cleared by any manual save.
      enum: [not_permitted, counter_wallet_unavailable, currency_mismatch, null]

    RecurringRule:
      description: |
        A repeating money movement set up once. Wallet-scoped and syncable;
        this is also the `recurring_rule` row of the wallet feed. A transfer
        rule lives in its source wallet's scope only.
      allOf:
        - $ref: '../components/schemas.yaml#/components/schemas/SyncableResource'
        - $ref: '../components/schemas.yaml#/components/schemas/WalletScoped'
        - type: object
          required: [preset, status, kind, amount_minor, amount_basis, currency, category_id, counter_wallet_id, description, memo, counterparty, auto_confirm, frequency, interval, anchor_day, start_date, end_date, occurrence_count, payout_round, payout_category_id, shared_budget_id, timezone, created_by]
          properties:
            preset:
              $ref: '#/components/schemas/Preset'
            status:
              $ref: '#/components/schemas/RuleStatus'
            kind:
              $ref: './transactions.yaml#/components/schemas/TransactionKind'
            amount_minor:
              $ref: './transactions.yaml#/components/schemas/PositiveMinorUnits'
            amount_basis:
              $ref: '#/components/schemas/AmountBasis'
            currency:
              $ref: './transactions.yaml#/components/schemas/Currency'
            category_id:
              type: [string, 'null']
              format: uuid
              description: Income or expense rule's category; null for a transfer.
            counter_wallet_id:
              type: [string, 'null']
              format: uuid
              description: Transfer only — the destination wallet. Never changes.
            description:
              $ref: './transactions.yaml#/components/schemas/Description'
            memo:
              $ref: './transactions.yaml#/components/schemas/Memo'
            counterparty:
              $ref: './transactions.yaml#/components/schemas/Counterparty'
            auto_confirm:
              type: boolean
              description: When true the server confirms each occurrence on its date (in `timezone`), as the rule's author. Never back-posts dates before the day this took effect.
            frequency:
              $ref: '#/components/schemas/Frequency'
            interval:
              type: integer
              minimum: 1
              maximum: 365
              description: Every `interval` days, weeks, months or years.
            anchor_day:
              type: [integer, 'null']
              minimum: 1
              maximum: 31
              description: Monthly and yearly only — the day of the month, clamped to the month's last day. Null for daily and weekly.
            start_date:
              $ref: './transactions.yaml#/components/schemas/CalendarDate'
            end_date:
              type: [string, 'null']
              format: date
              description: Last date the schedule may produce. At most one of `end_date` and `occurrence_count`.
            occurrence_count:
              type: [integer, 'null']
              minimum: 1
              maximum: 1000
              description: Number of rounds (skipped ones count). 2–120 for presets.
            payout_round:
              type: [integer, 'null']
              minimum: 1
              description: Gam'eya only — the round whose date carries the payout.
            payout_category_id:
              type: [string, 'null']
              format: uuid
              description: Gam'eya only — the income category of the payout.
            shared_budget_id:
              type: [string, 'null']
              format: uuid
              description: v1.16. The Shared Budget the rule's expenses count toward, or null. Set only by the rule's author.
            timezone:
              type: string
              readOnly: true
              description: Read-only. The IANA timezone captured from the author's profile at creation; "today" for this rule. Never changes.
              examples: ['Africa/Cairo']
            created_by:
              type: string
              format: uuid
              readOnly: true
              description: Read-only. The rule's author; every transaction it produces is recorded as theirs.

    RecurringRuleWrite:
      type: object
      description: |
        The whole writable rule plus the last-seen version. `id` comes from
        the path, `wallet_id` from the path at creation. `timezone`,
        `created_by`, `wallet_id`, `deleted_at`, `change_seq`, `created_at`
        and `updated_at` are refused with UNKNOWN_FIELD.
      required: [preset, status, kind, amount_minor, amount_basis, currency, category_id, counter_wallet_id, description, memo, counterparty, auto_confirm, frequency, interval, anchor_day, start_date, end_date, occurrence_count, payout_round, payout_category_id]
      additionalProperties: false
      properties:
        preset:
          $ref: '#/components/schemas/Preset'
        status:
          $ref: '#/components/schemas/RuleStatus'
        kind:
          $ref: './transactions.yaml#/components/schemas/TransactionKind'
        amount_minor:
          $ref: './transactions.yaml#/components/schemas/PositiveMinorUnits'
        amount_basis:
          $ref: '#/components/schemas/AmountBasis'
        currency:
          $ref: './transactions.yaml#/components/schemas/Currency'
        category_id:
          type: [string, 'null']
          format: uuid
        counter_wallet_id:
          type: [string, 'null']
          format: uuid
        description:
          $ref: './transactions.yaml#/components/schemas/Description'
        memo:
          $ref: './transactions.yaml#/components/schemas/Memo'
        counterparty:
          $ref: './transactions.yaml#/components/schemas/Counterparty'
        auto_confirm:
          type: boolean
        frequency:
          $ref: '#/components/schemas/Frequency'
        interval:
          type: integer
          minimum: 1
          maximum: 365
        anchor_day:
          type: [integer, 'null']
          minimum: 1
          maximum: 31
        start_date:
          $ref: './transactions.yaml#/components/schemas/CalendarDate'
        end_date:
          type: [string, 'null']
          format: date
        occurrence_count:
          type: [integer, 'null']
          minimum: 1
          maximum: 1000
        payout_round:
          type: [integer, 'null']
          minimum: 1
        payout_category_id:
          type: [string, 'null']
          format: uuid
        shared_budget_id:
          type: [string, 'null']
          format: uuid
          description: |
            v1.16. The Shared Budget the rule's transactions count toward (ADR-0027); null for none.
            Only an expense rule in the budget's currency, only by the rule's author, who must be an active
            member who is not read-only. Omitted keeps the stored link; null clears it.
        version:
          type: integer
          minimum: 0
          description: The client's last-seen version. Omitted or 0 means create.

    RuleVersionOnly:
      type: object
      required: [version]
      additionalProperties: false
      properties:
        version:
          type: integer
          minimum: 1
          description: The client's last-seen version of the rule.

    Occurrence:
      description: |
        One dated instance materialised by the server from a rule. Wallet-
        scoped and syncable; also the `occurrence` row of the wallet feed.
        Never in a balance; a confirmed occurrence points at the one
        transaction it produced. Its occurrence key is (`recurring_rule_id`,
        `scheduled_date`, `is_payout`).
      allOf:
        - $ref: '../components/schemas.yaml#/components/schemas/SyncableResource'
        - $ref: '../components/schemas.yaml#/components/schemas/WalletScoped'
        - type: object
          required: [recurring_rule_id, ordinal, is_payout, scheduled_date, date, status, kind, amount_minor, currency, category_id, counter_wallet_id, description, memo, counterparty, edited, transaction_id, auto_confirm_refusal]
          properties:
            recurring_rule_id:
              type: string
              format: uuid
              description: The rule that produced it, in the same wallet.
            ordinal:
              type: integer
              minimum: 1
              description: The round number in the rule's schedule (the payout carries its round's number).
            is_payout:
              type: boolean
              description: True only for a gam'eya rule's payout occurrence.
            scheduled_date:
              type: string
              format: date
              description: The date the schedule gave it. Never changes; part of the occurrence key.
            date:
              type: string
              format: date
              description: The effective date; equals `scheduled_date` unless edited.
            status:
              $ref: '#/components/schemas/OccurrenceStatus'
            kind:
              $ref: './transactions.yaml#/components/schemas/TransactionKind'
            amount_minor:
              $ref: './transactions.yaml#/components/schemas/PositiveMinorUnits'
            currency:
              $ref: './transactions.yaml#/components/schemas/Currency'
            category_id:
              type: [string, 'null']
              format: uuid
            counter_wallet_id:
              type: [string, 'null']
              format: uuid
            description:
              $ref: './transactions.yaml#/components/schemas/Description'
            memo:
              $ref: './transactions.yaml#/components/schemas/Memo'
            counterparty:
              $ref: './transactions.yaml#/components/schemas/Counterparty'
            edited:
              type: boolean
              description: True when its values differ from what the rule gives; rule edits then leave it alone.
            transaction_id:
              type: [string, 'null']
              format: uuid
              description: Set exactly when `status` is `confirmed` — the transaction it produced (which may since have been deleted).
            auto_confirm_refusal:
              $ref: '#/components/schemas/AutoConfirmRefusal'

    OccurrenceWrite:
      type: object
      description: |
        The whole writable occurrence plus the last-seen version. Everything
        else (`kind`, `currency`, `counter_wallet_id`, `scheduled_date`,
        `ordinal`, `is_payout`, `recurring_rule_id`, `edited`,
        `auto_confirm_refusal`, the syncable members) is refused with
        UNKNOWN_FIELD.
      required: [status, date, amount_minor, category_id, description, memo, counterparty, transaction_id, version]
      additionalProperties: false
      properties:
        status:
          $ref: '#/components/schemas/OccurrenceStatus'
        date:
          $ref: './transactions.yaml#/components/schemas/CalendarDate'
        amount_minor:
          $ref: './transactions.yaml#/components/schemas/PositiveMinorUnits'
        category_id:
          type: [string, 'null']
          format: uuid
        description:
          $ref: './transactions.yaml#/components/schemas/Description'
        memo:
          $ref: './transactions.yaml#/components/schemas/Memo'
        counterparty:
          $ref: './transactions.yaml#/components/schemas/Counterparty'
        transaction_id:
          type: [string, 'null']
          format: uuid
          description: A new client-generated UUIDv7 when `status` becomes `confirmed` (the id of the transaction recorded); null otherwise.
        version:
          type: integer
          minimum: 1
          description: The client's last-seen version. An occurrence is never created by a client.
