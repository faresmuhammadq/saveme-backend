                    range: { from: '2026-10-01', to: '2026-10-31' }
                    currency: EGP
                    expenses:
                      total: { amount_minor: 470000, currency: EGP }
                      planned: null
                      items:
                        - label: groceries
                          category_id: 0192f7c0-0000-7000-8000-000000000101
                          system_key: groceries
                          value: { amount_minor: 470000, currency: EGP }
                          planned: null
                    income:
                      total: { amount_minor: 0, currency: EGP }
                      planned: null
                      items: []
                  meta:
                    excluded_wallets: []
      '400': *badRequest
      '401': *unauthenticated
      '406': *notAcceptable
      '426': *upgradeRequired
      '500': *internalError

/reports/trend:
  get:
    operationId: getReportTrend
    tags: [Reporting]
    summary: Income, expenses and net per Budget Period across the caller's wallets in one currency.
    description: |
      As the wallet trend, over the covered wallets of `/reports/summary`.
      `wallet_id` is null; `meta.excluded_wallets` lists wallets in other
      currencies.

      Precedence: 401 → 400 INVALID_QUERY_PARAMETER → 200.
    parameters:
      - *reportDate
      - *months
      - *includePlanned
      - *reportCurrency
      - *acceptLanguage
      - *correlationId
      - *clientPlatform
      - *clientVersion
    responses:
      '200':
        description: The trend across the covered wallets.
        headers: *successHeaders
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas.yaml#/components/schemas/Envelope'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/ReportTrend'
                    meta:
                      $ref: '#/components/schemas/CrossWalletReportMeta'
            examples:
              twoPeriodsPlanned:
                summary: Two Budget Periods from the 25th, scheduled occurrences included
                value:
                  data:
                    wallet_id: null
                    currency: EGP
                    periods:
                      - { label: '2026-08-25', from: '2026-08-25', to: '2026-09-24' }
                      - { label: '2026-09-25', from: '2026-09-25', to: '2026-10-24' }
                    income:
                      - { label: '2026-08-25', value: { amount_minor: 1000000, currency: EGP } }
                      - { label: '2026-09-25', value: { amount_minor: 1000000, currency: EGP } }
                    expenses:
                      - { label: '2026-08-25', value: { amount_minor: 900000, currency: EGP } }
                      - { label: '2026-09-25', value: { amount_minor: 300000, currency: EGP } }
                    net:
                      - { label: '2026-08-25', value: { amount_minor: 100000, currency: EGP } }
                      - { label: '2026-09-25', value: { amount_minor: 700000, currency: EGP } }
                    planned_income:
                      - { label: '2026-08-25', value: { amount_minor: 0, currency: EGP } }
                      - { label: '2026-09-25', value: { amount_minor: 0, currency: EGP } }
                    planned_expenses:
                      - { label: '2026-08-25', value: { amount_minor: 0, currency: EGP } }
                      - { label: '2026-09-25', value: { amount_minor: 500000, currency: EGP } }
                  meta:
                    excluded_wallets: []
      '400': *badRequest
      '401': *unauthenticated
      '406': *notAcceptable
      '426': *upgradeRequired
      '500': *internalError

components:
  parameters:

    ReportDate:
      name: date
      in: query
      required: false
      description: |
        Any calendar date (`YYYY-MM-DD`, 1900-01-01 to 2999-12-31) inside the
        wanted Budget Period of the caller's (the trend: inside its last
        bucket). Absent means today in the caller's profile timezone. Never
        combined with `from`/`to`. Anything else is 400 INVALID_QUERY_PARAMETER.
      schema:
        type: string
        format: date
      examples:
        lastMonth:
          summary: A day in an earlier Budget Period
          value: '2026-09-10'

    ReportFrom:
      name: from
      in: query
      required: false
      description: |
        First day of an explicit Report Range (`YYYY-MM-DD`, inclusive). Sent
        together with `to`, never with `date`; `from` ≤ `to`; at most 366
        days; both within 1900-01-01 to 2999-12-31. Anything else is 400
        INVALID_QUERY_PARAMETER.
      schema:
        type: string
        format: date
      examples:
        september:
          value: '2026-09-01'

    ReportTo:
      name: to
      in: query
      required: false
      description: Last day of an explicit Report Range (`YYYY-MM-DD`, inclusive). See `from`.
      schema:
        type: string
        format: date
      examples:
        september:
          value: '2026-09-30'

    Months:
      name: months
      in: query
      required: false
      description: |
        How many consecutive Budget Periods the trend covers, 1 to 12. Absent
        means 6. Anything else is 400 INVALID_QUERY_PARAMETER (never clamped).
      schema:
        type: integer
        minimum: 1
        maximum: 12
        default: 6
      examples:
        year:
          value: 12

    IncludePlanned:
      name: include_planned
      in: query
      required: false
      description: |
        `true` adds separate planned figures summed from scheduled
        occurrences dated in the range; they never enter actual figures or
        balances. Absent or `false`: planned members are null. Anything else
        is 400 INVALID_QUERY_PARAMETER.
      schema:
        type: string
        enum: ['true', 'false']
        default: 'false'
      examples:
        withPlanned:
          value: 'true'

    ReportCurrency:
      name: currency
      in: query
      required: false
      description: |
        The one currency of a cross-wallet report, uppercase ISO 4217
        alpha-3. Absent means the caller's profile default currency (EGP
        without a profile). Lowercase or malformed is 400
        INVALID_QUERY_PARAMETER. Nothing is converted.
      schema:
        type: string
        pattern: '^[A-Z]{3}$'
      examples:
        usd:
          value: USD

  schemas:

    Money:
      $ref: '../components/schemas.yaml#/components/schemas/Money'

    ReportRange:
      type: object
      description: The inclusive span of calendar dates a report covers.
      required: [from, to]
      additionalProperties: false
      properties:
        from:
          type: string
          format: date
        to:
          type: string
          format: date

    PlannedSummary:
      type: [object, 'null']
      description: Sums of scheduled occurrences dated in the range; null unless `include_planned=true`.
      required: [income, expenses, transfers_in, transfers_out]
      additionalProperties: false
      properties:
        income:
          $ref: '#/components/schemas/Money'
        expenses:
          $ref: '#/components/schemas/Money'
        transfers_in:
          $ref: '#/components/schemas/Money'
        transfers_out:
          $ref: '#/components/schemas/Money'

    ReportSummary:
      type: object
      description: |
        Not syncable; computed on the read. Every money member is in
        `currency`. `income`, `expenses`, `transfers_in` and `transfers_out`
        are never negative; `net` and the balances may be.
      required: [wallet_id, range, currency, income, expenses, net, transfers_in, transfers_out, adjustments_in, adjustments_out, balance_start, balance_end, planned]
      additionalProperties: false
      properties:
        wallet_id:
          type: [string, 'null']
          format: uuid
          description: The wallet reported on; null for a cross-wallet report.
        range:
          $ref: '#/components/schemas/ReportRange'
        currency:
          type: string
          pattern: '^[A-Z]{3}$'
        income:
          $ref: '#/components/schemas/Money'
        expenses:
          $ref: '#/components/schemas/Money'
        net:
          $ref: '#/components/schemas/Money'
        transfers_in:
          $ref: '#/components/schemas/Money'
        transfers_out:
          $ref: '#/components/schemas/Money'
        adjustments_in:
          $ref: '#/components/schemas/Money'
        adjustments_out:
          $ref: '#/components/schemas/Money'
        balance_start:
          $ref: '#/components/schemas/Money'
        balance_end:
          $ref: '#/components/schemas/Money'
        planned:
          $ref: '#/components/schemas/PlannedSummary'

    CategoryItem:
      type: object
      description: One category's sum in the range. No share is sent.
      required: [label, category_id, system_key, value, planned]
      additionalProperties: false
      properties:
        label:
          type: string
          description: The grouping key — the platform category's `system_key`, else the category id. A machine key, never display text.
        category_id:
          type: string
          format: uuid
        system_key:
          type: [string, 'null']
          description: Set for a platform category; null for a person's category.
        value:
          $ref: '#/components/schemas/Money'
        planned:
          description: Scheduled occurrences in this category; null unless `include_planned=true`.
          oneOf:
            - $ref: '#/components/schemas/Money'
            - type: 'null'

    CategoryGroup:
      type: object
      required: [total, planned, items]
      additionalProperties: false
      properties:
        total:
          $ref: '#/components/schemas/Money'
        planned:
          description: Sum of the items' `planned`; null unless `include_planned=true`.
          oneOf:
            - $ref: '#/components/schemas/Money'
            - type: 'null'
        items:
          type: array
          description: Sorted by `value.amount_minor` descending, then `label` ascending.
          items:
            $ref: '#/components/schemas/CategoryItem'

    ReportByCategory:
      type: object
      description: Not syncable; computed on the read.
      required: [wallet_id, range, currency, expenses, income]
      additionalProperties: false
      properties:
        wallet_id:
          type: [string, 'null']
          format: uuid
          description: The wallet reported on; null for a cross-wallet report.
        range:
          $ref: '#/components/schemas/ReportRange'
        currency:
          type: string
          pattern: '^[A-Z]{3}$'
        expenses:
          $ref: '#/components/schemas/CategoryGroup'
        income:
          $ref: '#/components/schemas/CategoryGroup'

    TrendBudgetPeriod:
      type: object
      description: One Budget Period of the trend.
      required: [label, from, to]
      additionalProperties: false
      properties:
        label:
          type: string
          format: date
          description: The period's start date; the key of this period in every series.
        from:
          type: string
          format: date
        to:
          type: string
          format: date

    ChartPoint:
      type: object
      description: One chart point; `label` matches a `periods[].label`.
      required: [label, value]
      additionalProperties: false
      properties:
        label:
          type: string
        value:
          $ref: '#/components/schemas/Money'

    ChartSeries:
      type: array
      description: One point per period, in the order of `periods`.
      items:
        $ref: '#/components/schemas/ChartPoint'

    ReportTrend:
      type: object
      description: Not syncable; computed on the read. Transfers are not in the trend.
      required: [wallet_id, currency, periods, income, expenses, net, planned_income, planned_expenses]
      additionalProperties: false
      properties:
        wallet_id:
          type: [string, 'null']
          format: uuid
          description: The wallet reported on; null for a cross-wallet report.
        currency:
          type: string
          pattern: '^[A-Z]{3}$'
        periods:
          type: array
          minItems: 1
          maxItems: 12
          items:
            $ref: '#/components/schemas/TrendBudgetPeriod'
        income:
          $ref: '#/components/schemas/ChartSeries'
        expenses:
          $ref: '#/components/schemas/ChartSeries'
        net:
          $ref: '#/components/schemas/ChartSeries'
        planned_income:
          description: Null unless `include_planned=true`.
          oneOf:
            - $ref: '#/components/schemas/ChartSeries'
            - type: 'null'
        planned_expenses:
          description: Null unless `include_planned=true`.
          oneOf:
            - $ref: '#/components/schemas/ChartSeries'
            - type: 'null'

    WalletReportMeta:
      type: object
      description: Always `{}` for a wallet report.
      additionalProperties: false
      maxProperties: 0

    CrossWalletReportMeta:
      type: object
      required: [excluded_wallets]
      additionalProperties: false
      properties:
        excluded_wallets:
          type: array
          description: |
            Every live wallet the caller belongs to whose currency is not the
            report's, sorted by `wallet_id`; none of its money is in any figure.
            Empty when none.
          items:
            type: object
            required: [wallet_id, currency]
            additionalProperties: false
            properties:
              wallet_id:
                type: string
                format: uuid
              currency:
                type: string
                pattern: '^[A-Z]{3}$'
