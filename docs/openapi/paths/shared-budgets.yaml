  put:
    operationId: sendSharedBudgetInvitation
    tags: [Budgeting]
    summary: 'Invite someone to a Shared Budget by link.'
    description: |
      Owner only, and only by link in this release. A new invitation lives 7
      days and needs the owner's plan to share with a seat free
      (403 FEATURE_NOT_ENTITLED). The `201` carries `meta.share_url`, the only
      time the link exists. A repeat returns the invitation with no link.
      Counts against the caller's 24-hour invitation budget (429).
    parameters:
      - *budgetId
      - *invitationId
      - $ref: '../components/headers.yaml#/components/parameters/AcceptLanguage'
      - $ref: '../components/headers.yaml#/components/parameters/XCorrelationId'
      - $ref: '../components/headers.yaml#/components/parameters/XClientPlatform'
      - $ref: '../components/headers.yaml#/components/parameters/XClientVersion'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SharedBudgetInvitationWrite'
    responses:
