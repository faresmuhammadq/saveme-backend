name: saveme-infra

services:
  postgres:
    image: postgres:16
    container_name: saveme-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -h 127.0.0.1"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - infra

  mailpit:
    image: axllent/mailpit:latest
    container_name: saveme-mailpit
    restart: unless-stopped
    ports:
      - "0.0.0.0:${MAILPIT_UI_PORT:-8026}:8025"
    networks:
      - infra

volumes:
  postgres-data:
    name: saveme-postgres

networks:
  infra:
    name: saveme-infra
