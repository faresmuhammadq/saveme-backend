name: pipeline

# Forgejo (git.lab.internal) pipeline, run by the self-hosted runner in the forge VM.
# GitHub ignores .forgejo/, and Forgejo ignores .github/ once this folder exists.
#
#   every push / PR      -> ci (the quality gate) [+ commit-messages on PRs]
#   push to staging      -> ci, then image: saveme-backend:<sha12> + :staging    (Dockerfile.staging)
#   push to main         -> ci, then image: saveme-backend:<sha12> + :production (Dockerfile)
#   workflow_dispatch    -> ci, then image for the chosen env, from the dispatched ref
#
# The image goes to the forge registry (git.lab.internal/fares/saveme-backend). The homelab host
# deploys it with `lab deploy saveme-<env>` (staging: every 5 minutes via `lab timer`). See docs/deployment.md.
#
# Secrets: CI_TOKEN, a Forgejo access token with write:package.

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      env:
        description: Environment whose image to build and push
        required: true
        type: choice
        default: staging
        options:
          - staging
          - production

env:
  REGISTRY: git.lab.internal
  IMAGE: git.lab.internal/fares/saveme-backend

jobs:
  # The quality gate, in the order docs/engineering-conventions.md fixes.
  # Each stage is its own step, so a failure stops the later stages and the
  # red step names the stage that failed.
  ci:
    runs-on: ubuntu-latest

    # The suite runs on PostgreSQL 16, the production engine (ADR-0001, constitution P-16).
    # The job itself runs in a container, so the service is reached by its name, not 127.0.0.1.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: saveme_backend_main_test
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    # Laravel loads .env immutably, so these win over the committed .env.example.
    env:
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: saveme_backend_main_test
      DB_USERNAME: postgres
      DB_PASSWORD: postgres

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # Full history and tags, for the frozen-migrations check.
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: pdo_pgsql, pgsql
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          # GitHub release downloads are very slow from the lab network; nodejs.org (Cloudflare) is not.
          mirror: https://nodejs.org/dist

      # composer install boots the app (package:discover) before `composer setup` would copy .env;
      # without it APP_ENV falls back to production and the Billing provider refuses MAIL_MAILER=log.
      # The job env above still wins over .env for the database settings.
      - name: Setup Application
        run: |
          cp .env.example .env
          composer setup

      - name: "Stage 1 — Formatting"
        run: composer test:lint

      - name: "Stage 2 — Static analysis (Larastan level 8)"
        run: composer test:types

      - name: "Stage 3 — Architecture (P-02, P-03, P-09)"
        run: composer test:arch

      - name: "Stage 4 — Database engine"
        env:
          PGPASSWORD: postgres
        run: |
          command -v psql >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client >/dev/null; }
          version="$(psql -h "$DB_HOST" -U postgres -d "$DB_DATABASE" -tAc 'SELECT version()')"
          {
            echo "### Database engine"
            echo
            echo "\`$version\`"
          } >> "$GITHUB_STEP_SUMMARY"
          case "$version" in
            "PostgreSQL 16."*) echo "Tested against: $version" ;;
            *) echo "::error title=Database engine::P-16 rule 2 and ADR-0001 require PostgreSQL 16, got: $version"; exit 1 ;;
          esac

      - name: "Stage 5 — Frozen migrations (append-only from v1.0.0)"
        run: |
          if ! git rev-parse -q --verify "refs/tags/v1.0.0" >/dev/null; then
            echo "No v1.0.0 tag yet: migrations may still be edited or squashed."
            exit 0
          fi
          changed="$(git diff --name-status v1.0.0..HEAD -- database/migrations 'app/Modules/*/Infrastructure/Database/Migrations' | grep -E '^(M|D|R)' || true)"
          if [ -n "$changed" ]; then
            echo "::error title=Frozen migrations::A migration released in v1.0.0 was edited, renamed or deleted. Correct the schema with a new migration instead."
            echo "$changed"
            exit 1
          fi
          echo "No released migration was changed."

      - name: "Stage 6 — Test suite (Unit, Feature, Contract)"
        run: composer test:suite

  # A separate job, so a badly worded commit never hides what the code stages found.
  commit-messages:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Commit messages follow the conventional shape
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          pattern='^(feat|fix|docs|chore|refactor|test|build|ci)(\([a-z0-9._/-]+\))?!?: .+$'
          bad=0
          while IFS= read -r line; do
            sha="${line%% *}"
            subject="${line#* }"
            if ! printf '%s' "$subject" | grep -Eq "$pattern"; then
              echo "::error title=Commit message shape::$sha \"$subject\" — expected <type>(<scope>)!: <subject>, type one of feat fix docs chore refactor test build ci"
              bad=1
            elif [ "${#subject}" -gt 72 ]; then
              echo "::error title=Commit message length::$sha subject is ${#subject} characters; the limit is 72"
              bad=1
            fi
          done < <(git log --no-merges --format='%h %s' "$BASE_SHA..$HEAD_SHA")
          exit "$bad"

  # Builds the env's image with the VM's Docker daemon (socket automounted by the runner) and pushes it
  # to the forge registry. Plain docker CLI on purpose: a buildx builder container has its own DNS and
  # CA store and would not see git.lab.internal or the lab CA.
  image:
    needs: ci
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && (github.ref == 'refs/heads/staging' || github.ref == 'refs/heads/main'))
    runs-on: ubuntu-latest
    concurrency:
      group: image-${{ inputs.env || (github.ref == 'refs/heads/main' && 'production') || 'staging' }}
      cancel-in-progress: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Pick the environment
        id: target
        env:
          INPUT_ENV: ${{ inputs.env }}
        run: |
          case "${INPUT_ENV:-$GITHUB_REF_NAME}" in
            staging) env=staging; dockerfile=Dockerfile.staging ;;
            production|main) env=production; dockerfile=Dockerfile ;;
            *) echo "::error::no environment for '${INPUT_ENV:-$GITHUB_REF_NAME}'"; exit 1 ;;
          esac
          echo "env=$env" >> "$GITHUB_OUTPUT"
          echo "dockerfile=$dockerfile" >> "$GITHUB_OUTPUT"
          echo "short=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - name: Log in to the forge registry
        env:
          CI_TOKEN: ${{ secrets.CI_TOKEN }}
        run: |
          test -n "$CI_TOKEN" || { echo "::error::CI_TOKEN secret is not set"; exit 1; }
          printf '%s' "$CI_TOKEN" | docker login "$REGISTRY" -u "$GITHUB_ACTOR" --password-stdin

      # Same shape as `lab build`: the committed tree only, tagged with its commit and the env's moving tag.
      - name: Build image
        env:
          ENV_NAME: ${{ steps.target.outputs.env }}
          DOCKERFILE: ${{ steps.target.outputs.dockerfile }}
          SHORT: ${{ steps.target.outputs.short }}
        run: |
          git archive --format=tar "$GITHUB_SHA" \
            | docker build -f "$DOCKERFILE" --target app \
                --build-arg "APP_VERSION=$GITHUB_SHA" \
                -t "$IMAGE:$SHORT" -t "$IMAGE:$ENV_NAME" -

      - name: Push image
        env:
          ENV_NAME: ${{ steps.target.outputs.env }}
          SHORT: ${{ steps.target.outputs.short }}
        run: |
          docker push "$IMAGE:$SHORT"
          docker push "$IMAGE:$ENV_NAME"
          {
            echo "### Image"
            echo
            echo "\`$IMAGE:$SHORT\` (also \`:$ENV_NAME\`)"
            echo
            echo "Deploy on the homelab host: \`lab deploy saveme-$ENV_NAME\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Clean up
        if: always()
        env:
          ENV_NAME: ${{ steps.target.outputs.env }}
          SHORT: ${{ steps.target.outputs.short }}
        run: |
          docker rmi "$IMAGE:$SHORT" "$IMAGE:$ENV_NAME" >/dev/null 2>&1 || true
          docker logout "$REGISTRY" >/dev/null 2>&1 || true
